<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff0f6">
<title>A Little Surprise for Puchu 💗</title>
<style>
:root{--pink:#d887b5;--ink:#65445e;--soft:#fff0f6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fff 0,#fff2f8 48%,#f4eaff 100%);font-family:Georgia,serif;color:var(--ink)}
.card{width:min(100%,440px);background:#ffffffd9;border:1px solid #f1d8e8;border-radius:28px;padding:28px 22px;box-shadow:0 18px 55px #a86e9120;text-align:center}
.tag{font:12px system-ui;letter-spacing:2px;text-transform:uppercase;color:#a47799}
h1{font-size:clamp(27px,7vw,36px);margin:13px 0 10px}
p{font-size:17px;line-height:1.65;margin:10px 0}
.flower{font-size:46px}
.progress{height:6px;background:#f5e5ef;border-radius:20px;overflow:hidden;margin:20px 0}
#bar{height:100%;width:25%;background:var(--pink);transition:width .3s}
button{font:600 15px system-ui;cursor:pointer;border:1px solid #edcfe1;border-radius:15px;padding:14px 16px;background:#fff8fc;color:var(--ink);width:100%;margin-top:10px}
button:hover{background:#ffedf6}
.primary{background:var(--pink);color:white;border:0;border-radius:999px;padding:13px 24px;width:auto;min-width:160px}
.primary:hover{background:#c875a7}
#choices{margin-top:15px}
.small{font:12px system-ui;color:#987c92;margin-top:20px}
button:focus-visible{outline:3px solid #a95b91;outline-offset:3px}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="tag">a tiny surprise, just for you</div>
  <div class="flower" id="flower">🌷</div>
  <h1 id="title">Hey, Puchu! 💗</h1>
  <p id="story">Or should I say… Dumbo? 😄 Someone made a little game for you. There are a few questions and a tiny surprise at the end. Ready?</p>
  <div class="progress"><div id="bar"></div></div>
  <div id="choices"></div>
  <button class="primary" id="next">Let's begin ✨</button>
  <div class="small" id="foot">Made with a little courage and a lot of nervousness.</div>
</main>
<script>
const chapters=[
 {emoji:"🌸",title:"A little question",story:"If you could pick a perfect little moment, what would it be?",answers:["A peaceful sunset 🌅","A night under the stars ✨","A day full of laughter 🌷"]},
 {emoji:"💌",title:"One more thing...",story:"What makes an ordinary day feel special?",answers:["A sweet unexpected message 💗","Someone remembering tiny details 🌼","Laughing over silly things 😂"]},
 {emoji:"🦋",title:"Can I tell you something?",story:"Okay, this next part is a little personal. I really enjoy talking to you, Puchu. You make ordinary moments feel a little brighter. 🙈",answers:["Awww 🥹","I had a feeling! 💕","You're making me curious 👀"]}
];
let step=-1;
const $=id=>document.getElementById(id);
function showChapter(){
 const c=chapters[step];$("flower").textContent=c.emoji;$("title").textContent=c.title;$("story").textContent=c.story;
 $("bar").style.width=((step+1)*25)+"%";$("choices").innerHTML="";
 c.answers.forEach(a=>{const b=document.createElement("button");b.textContent=a;b.addEventListener("click",()=>{[...$("choices").children].forEach(x=>x.style.background="#fff8fc");b.style.background="#f9ddeb"});$("choices").appendChild(b)});
 $("next").hidden=false;$("next").textContent=step===2?"The surprise 💗":"Continue →";
 $("foot").textContent=`Chapter ${step+1} of 4 · No wrong answers here.`;
}
function showFinal(){
 $("flower").textContent="💗";$("title").textContent="One last question, Puchu...";
 $("story").textContent="I've been a little shy about saying this, but I really like you. Would you like to be my girlfriend? ❤️";
 $("bar").style.width="100%";$("choices").innerHTML="";
 const responses=[
  ["YES! ❤️","You just made me really happy! I'd love to see where this goes. 🌷"],
  ["I NEED TIME 🌼","Of course. Take all the time you need. There's no pressure at all. 🤍"],
  ["LET'S STAY FRIENDS 🤍","Thank you for being honest with me. I respect how you feel. 🌸"]
 ];
 responses.forEach(([label,msg])=>{const b=document.createElement("button");b.textContent=label;b.addEventListener("click",()=>{
   $("flower").textContent="🌷";$("title").textContent="Thank you for answering!";
   $("story").textContent=msg;$("choices").innerHTML="";
   $("next").hidden=true;$("foot").textContent="Whatever your answer, I'm glad I got to tell you.";
 });$("choices").appendChild(b)});
 $("next").hidden=true;$("foot").textContent="The most important thing is that you feel comfortable.";
}
$("next").addEventListener("click",()=>{step++;if(step<3)showChapter();else showFinal()});
</script>
</body>
</html>
